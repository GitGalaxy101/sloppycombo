name: Windows prototype prerelease

on:
  push:
    tags:
      - v0.1.0-dev

permissions:
  contents: read

concurrency:
  group: windows-prototype-v0.1.0-dev
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen --extra dev
      - name: Check the design and run synthetic tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          .venv/bin/python tools/preflight.py
          .venv/bin/python tools/generate_design.py --check
          .venv/bin/python -m pytest -q
      - name: Build the portable Windows ZIP
        run: .venv/bin/python scripts/package_windows.py
      - name: Upload verified assets and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/publish_github_release.py
